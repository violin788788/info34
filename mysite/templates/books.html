<!DOCTYPE html>
<html>
<head>
<title>My Books</title>
</head>
<body>
<h1>My Books</h1>
{% if books %}
<table border="1" cellpadding="8">
<tr>
<th>ID</th>
<th>Title</th>
<th>Author</th>
<th>Year</th>
<th>Current Page</th>
<th>Total Pages</th>
</tr>
{% for book in books %}
<tr>
<td>{{ book.id }}</td>
<td>{{ book.title }}</td>
<td>{{ book.author }}</td>
<td>{{ book.year }}</td>
<td>{{ book.current_page }}</td>
<td>{{ book.total_pages }}</td>
</tr>
{% endfor %}
</table>
{% else %}
<p>No books in the database yet.</p>
{% endif %}
</body>
</html>
