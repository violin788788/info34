<!DOCTYPE html>
<html>
<head>
<title>Books</title>
<style>
body{font-family:Arial,sans-serif;margin:20px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #ccc;padding:8px;min-width:100px}
th{background:#eee}
td.editable{cursor:text}
td.editable:focus{outline:2px solid #4285f4;background:#fff}
#status{position:fixed;top:10px;right:10px;padding:8px 15px;background:#28a745;color:white;display:none}
</style>
</head>
<body>
<h1>Books</h1>
<div id="status">Saved!</div>
<table>
<tbody>
{% for row in rows %}
<tr>
{% for cell in row %}
<td class="editable" contenteditable="true" data-row="{{ loop.index0 }}" data-column="{{ loop.index0 }}">{{ cell }}</td>
{% endfor %}
</tr>
{% endfor %}
</tbody>
</table>
<script>
document.querySelectorAll('.editable').forEach(function(cell){
cell.addEventListener('blur',function(){
const row=this.dataset.row;
const column=this.dataset.column;
const value=this.innerText;
fetch('/update_book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({row:row,column:column,value:value})}).then(response=>response.json()).then(data=>{
if(data.success){
const status=document.getElementById('status');
status.style.display='block';
setTimeout(function(){status.style.display='none'},1000);
}else{alert('Save failed: '+data.error)}
}).catch(error=>{alert('Error saving: '+error)});
});
});
</script>
</body>
</html>
